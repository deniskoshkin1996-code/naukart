<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация — НАУК(А)РТ</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ВСТАВЬТЕ СЮДА КОД ИЗ ПУНКТА 2 (ШАПКА) -->

<section class="page-hero">
  <div class="container">
    <h1>Регистрация участника</h1>
    <p>Подай заявку на участие в проекте</p>
  </div>
</section>

<section class="page-content" style="background: var(--soft);">
  <div class="container">
    <div class="form-box" style="max-width: 600px; margin: 0 auto; background: #fff; padding: 40px; border-radius: 18px; box-shadow: var(--shadow);">
      
      <form id="registerForm">
        <div class="form-group">
          <label>Фамилия и имя *</label>
          <input type="text" id="name" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Email *</label>
          <input type="email" id="email" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Пароль *</label>
          <input type="password" id="password" class="form-control" placeholder="Минимум 6 символов" required>
        </div>
        <div class="form-group">
          <label>Школа или вуз *</label>
          <input type="text" id="organization" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Город *</label>
          <input type="text" id="city" class="form-control" required>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%;">Зарегистрироваться</button>
      </form>

      <p style="text-align: center; margin-top: 20px;">
        Уже есть аккаунт? <a href="login.html" style="color: var(--brand-teal); font-weight: bold;">Войти</a>
      </p>

    </div>
  </div>
</section>

<!-- ВСТАВЬТЕ СЮДА КОД ИЗ ПУНКТА 3 (ПОДВАЛ) -->
<script src="menu.js"></script>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

  // ВСТАВЬТЕ ВАШИ КЛЮЧИ ИЗ SUPABASE
  const supabaseUrl = 'ВАШ_SUPABASE_URL'
  const supabaseKey = 'ВАШ_ANON_KEY'
  const supabase = createClient(supabaseUrl, supabaseKey)

  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault()
    
    const email = document.getElementById('email').value
    const password = document.getElementById('password').value
    const fullName = document.getElementById('name').value
    const school = document.getElementById('organization').value
    const city = document.getElementById('city').value

    // 1. Создаем аккаунт
    const { data: authData, error: authError } = await supabase.auth.signUp({
      email: email,
      password: password,
    })

    if (authError) {
      alert('Ошибка: ' + authError.message)
      return
    }

    // 2. Сохраняем профиль
    if (authData.user) {
      const { error: profileError } = await supabase
        .from('profiles')
        .insert([{ id: authData.user.id, full_name: fullName, school: school, city: city }])

      if (profileError) {
        alert('Ошибка профиля: ' + profileError.message)
      } else {
        alert('Успех! Теперь вы можете войти.')
        window.location.href = 'login.html'
      }
    }
  })
</script>
</body>
</html>
